<!-- BACK BUTTON CONFIRM (glass bottom sheet — same design as pause) -->
<div id="ov-back-confirm" class="ov hidden">
  <div class="ovc pause-ovc g-sheet">
    <div class="g-sh">
      <span class="g-sock"><svg class="gi"><use href="#gi-pause"/></svg></span>
      <h3 class="pause-title">סיום המשחק</h3>
      <button class="g-chip ic" onclick="backConfirmStay()" aria-label="חזור למשחק"><svg class="gi"><use href="#gi-x"/></svg></button>
    </div>
    <div class="g-dim pause-sub" data-gm="מה תרצה לעשות?" data-gf="מה תרצי לעשות?">מה תרצה לעשות?</div>

    <div class="g-list pause-actions">
      <button class="g-li pause-action pause-action--primary" onclick="backConfirmStay()">
        <span class="g-sock"><svg class="gi"><use href="#gi-play"/></svg></span>
        <span class="tx pause-action-body"><b class="pause-action-label" data-gm="חזור למשחק" data-gf="חזרי למשחק">חזור למשחק</b><span class="pause-action-sub" data-gm="המשך לשחק עכשיו" data-gf="המשיכי לשחק עכשיו">המשך לשחק עכשיו</span></span>
        <svg class="gi g-chev"><use href="#gi-fwd"/></svg>
      </button>
      <button class="g-li pause-action pause-action--save" onclick="pauseGame();backConfirmStay()">
        <span class="g-sock gold"><svg class="gi"><use href="#gi-pause"/></svg></span>
        <span class="tx pause-action-body"><b class="pause-action-label">השהה ושמור</b><span class="pause-action-sub">חזור למשחק מאוחר יותר</span></span>
        <span class="g-pill gd pause-action-badge">★ מומלץ</span>
      </button>
      <button class="g-li pause-action pause-action--quit" onclick="backConfirmLeave()">
        <span class="g-sock red"><svg class="gi"><use href="#gi-logout"/></svg></span>
        <span class="tx pause-action-body"><b class="pause-action-label" style="color:#ff8f9c">צא ללא שמירה</b><span class="pause-action-sub">ההתקדמות תאבד</span></span>
        <svg class="gi g-chev"><use href="#gi-fwd"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- RESIGN CONFIRM (glass dialog, red) -->
<div id="ov-resign-confirm" class="ov hidden">
  <div class="ovc dlg-red">
    <div class="ovic ovic--red"><svg class="gi"><use href="#gi-flag"/></svg></div>
    <div class="ovt">לפרוש מהמשחק?</div>
    <div class="ovd" id="resign-confirm-msg">היריב יקבל ניצחון מיידי.</div>
    <div class="ovbtns">
      <button class="ovb s danger" id="resign-confirm-yes">פרוש</button>
      <button class="ovb p" id="resign-confirm-no" data-gm="המשך לשחק" data-gf="המשיכי לשחק">המשך לשחק</button>
    </div>
  </div>
</div>
