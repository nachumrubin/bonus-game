<!-- BONUS SPECTATOR — shown to the opponent while the active player is in a boost flow -->
<div id="ov-bonus-spectator" class="ov hidden">
  <div class="ovc">
    <div class="ovic" id="bspec-ic">⚡</div>
    <div class="ovt" id="bspec-title">היריב מקבל בוסט!</div>
    <div class="ovd" id="bspec-desc"></div>
    <!-- The word the opponent just played. Their tiles are already committed to
         the board, but this overlay covers it for the whole mini-game — so show
         the move here rather than leaving the player in the dark for up to 60s. -->
    <div class="ovd" id="bspec-move" style="margin-top:10px;color:var(--by);font-weight:900;font-size:16px"></div>
    <div class="ovd" id="bspec-progress" style="margin-top:12px;color:rgba(255,255,255,.7);font-size:14px">⏳ ממתין לתוצאה...</div>
  </div>
</div>
