<!-- ONLINE LOBBY (glass skin — tools/screens-mockup "#so") -->
<div id="so" class="screen hidden g-screen">
  <div class="g-page">
    <div class="g-hdr">
      <button class="g-chip ic" onclick="goHome()" aria-label="חזרה"><svg class="gi"><use href="#gi-back"/></svg></button>
      <div class="g-ttl"><svg class="gi"><use href="#gi-globe"/></svg>משחק ברשת</div>
      <span></span>
    </div>
    <div class="g-scroll" style="gap:12px">
      <div style="padding:6px 0 4px">
        <div class="g-medal" style="--s:120px"><img id="ol-globe" class="ol-globe" src="assets/icons/globe.png" alt="" aria-hidden="true"></div>
      </div>
      <div class="g-c g-dim" style="font-size:14px;margin-bottom:6px" data-gm="בחר כיצד תרצה לשחק" data-gf="בחרי כיצד תרצי לשחק">בחר כיצד תרצה לשחק</div>
      <button class="g-card g-mode hl" onclick="onlineMatchmaking()">
        <span class="g-sock lg"><svg class="gi"><use href="#gi-dice"/></svg></span>
        <span class="g-mode-tx"><b data-gm="חפש יריב אקראי" data-gf="חפשי יריב אקראי">חפש יריב אקראי</b><span data-gm="התחבר לשחקן זמין · מדורג" data-gf="התחברי לשחקן זמין · מדורג">התחבר לשחקן זמין · מדורג</span></span>
        <span class="g-mode-go"><svg class="gi"><use href="#gi-fwd"/></svg></span>
      </button>
      <button class="g-card g-mode" onclick="onlineCreateRoom()">
        <span class="g-sock lg"><svg class="gi"><use href="#gi-plus"/></svg></span>
        <span class="g-mode-tx"><b data-gm="פתח משחק חדש" data-gf="פתחי משחק חדש">פתח משחק חדש</b><span data-gm="בחר הגדרות ושלח קוד לחבר" data-gf="בחרי הגדרות ושלחי קוד לחבר">בחר הגדרות ושלח קוד לחבר</span></span>
        <span class="g-mode-go"><svg class="gi"><use href="#gi-fwd"/></svg></span>
      </button>
      <button class="g-card g-mode" onclick="onlineJoinByCode()">
        <span class="g-sock lg"><svg class="gi"><use href="#gi-key"/></svg></span>
        <span class="g-mode-tx"><b data-gm="הצטרף לפי קוד" data-gf="הצטרפי לפי קוד">הצטרף לפי קוד</b><span data-gm="הזן קוד שקיבלת מחבר" data-gf="הזיני קוד שקיבלת מחבר">הזן קוד שקיבלת מחבר</span></span>
        <span class="g-mode-go"><svg class="gi"><use href="#gi-fwd"/></svg></span>
      </button>
    </div>
  </div>
</div>
