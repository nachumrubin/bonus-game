<div id="tut-intro" class="hidden" dir="rtl">
  <div id="tut-intro-box">
    <div class="g-medal tut-g-medal" style="--s:80px"><svg class="gi"><use href="#gi-cap"/></svg></div>
    <div id="tut-intro-title">הדרכה</div>
    <div id="tut-intro-body">
      <p>ברוך הבא להדרכה! כאן תלמד את כל מה שצריך כדי לשחק.</p>

      <button id="tut-intro-back" onclick="hideTutorialIntro()">חזרה לתפריט</button>

    </div>
  </div>
