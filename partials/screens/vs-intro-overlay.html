<!-- VS INTRO — plays inside the existing ~1.4s gap between "opponent found" and the board -->
<div id="ov-vs-intro" class="ov hidden vs-intro" aria-hidden="true">
  <div class="vs-stage">
    <div class="vs-side vs-side--me">
      <div class="vs-av" id="vs-my-av"></div>
      <div class="vs-nm" id="vs-my-name"></div>
      <div class="vs-elo" id="vs-my-elo"></div>
    </div>
    <div class="vs-mid">
      <div class="vs-strike"></div>
      <div class="vs-txt">VS</div>
    </div>
    <div class="vs-side vs-side--opp">
      <div class="vs-av" id="vs-opp-av"></div>
      <div class="vs-nm" id="vs-opp-name"></div>
      <div class="vs-elo" id="vs-opp-elo"></div>
    </div>
  </div>
</div>
