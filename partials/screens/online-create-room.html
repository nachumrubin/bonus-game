<!-- ONLINE: CREATE ROOM (glass bottom sheet — tools/screens-mockup "#ov-create-room") -->
<div id="ov-create-room" class="ov hidden">
  <div class="ovc mf-ovc g-sheet">
    <div class="g-sh">
      <span class="g-sock"><svg class="gi"><use href="#gi-plus"/></svg></span>
      <h3>פתיחת משחק חדש</h3>
      <button class="g-chip ic" onclick="ovClose('ov-create-room')" aria-label="ביטול"><svg class="gi"><use href="#gi-x"/></svg></button>
    </div>
    <div class="g-dim" data-gm="בחר הגדרות ושלח את הקוד לחבר" data-gf="בחרי הגדרות ושלחי קוד לחבר">בחר הגדרות ושלח את הקוד לחבר</div>

    <div id="cr-name-row" class="mf-name-row">
      <label class="g-flbl" for="cr-name">השם שלך</label>
      <div class="g-fld"><svg class="gi"><use href="#gi-user"/></svg><input id="cr-name" type="text" placeholder="השם שלך" maxlength="10"></div>
    </div>

    <div>
      <div class="g-lbl">סוג משחק</div>
      <div class="g-seg">
        <button id="cr-mode-live" class="active" onclick="crSetMode('live')"><svg class="gi"><use href="#gi-bolt"/></svg>לייב</button>
        <button id="cr-mode-async" onclick="crSetMode('async')"><svg class="gi"><use href="#gi-mail"/></svg>אסינכרוני</button>
      </div>
    </div>

    <div id="cr-speed-row">
      <div class="g-lbl">קצב משחק</div>
      <div class="g-seg">
        <button id="cr-spd-20">בזק · 20</button>
        <button id="cr-spd-40" class="active">רגיל · 40</button>
        <button id="cr-spd-60">איטי · 60</button>
      </div>
    </div>

    <button class="g-btn go" onclick="crConfirm()">פתח משחק ▶</button>
  </div>
</div>
