<!-- HOME -->
<div id="sh" class="screen hidden">
  <div class="hc em-home">

    <!-- ─ Logo ──────────────────────────────────── -->
    <!-- Wood tiles spell the wordmark (DOM order ב,ו,ס,ט — RTL renders it right-to-left). -->
    <div class="hlogo" role="img" aria-label="בוסט">
      <div class="hl-tile"><span class="hl-l">ב</span></div>
      <div class="hl-tile"><span class="hl-l">ו</span></div>
      <div class="hl-tile"><span class="hl-l">ס</span><svg class="hl-bolt" viewBox="0 0 72 72" aria-hidden="true"><path d="M41 -2 29 34h12L27 76" fill="none" stroke="#071238" stroke-width="4.5" stroke-linejoin="round"/><path d="M41 -2 29 34h12L27 76" fill="none" stroke="#46dcf5" stroke-width="2" stroke-linejoin="round"/></svg></div>
      <div class="hl-tile"><span class="hl-l">ט</span></div>
    </div>

    <!-- ─ "Your turn" strip — shown by menuScreen when N async games wait on you ─ -->
    <button class="hm-strip hm-strip--turn" id="home-turn-strip" style="display:none">
      <span class="hm-strip-ic" aria-hidden="true"><svg class="hm-i" viewBox="0 0 24 24"><path d="M13.5 2 4 13.5h6.5L9 22l11-12.5h-6.8z"/></svg></span>
      <span class="hm-strip-tx" id="home-turn-strip-text">תורך ב-2 משחקים</span>
      <span class="hm-strip-avs" id="home-turn-strip-avs"></span>
      <span class="hm-strip-chev" aria-hidden="true">❯</span>
    </button>

    <!-- ─ Game Mode Cards ────────────────────────── -->
    <div class="hm-cards">

      <!-- Online -->
      <button class="hm-card hm-card--online" id="btn-online-lobby" onclick="showOnlineLobby()">
        <div class="hm-card-icon">
          <img src="assets/icons/globe.png" alt="">
        </div>
        <div class="hm-card-body">
          <span class="hm-card-title">משחק ברשת</span>
          <span class="hm-card-sub">שחק מול שחקנים אמיתיים ברחבי העולם</span>
        </div>
        <div class="hm-card-chev">❯</div>
      </button>

      <!-- Bot -->
      <button class="hm-card hm-card--bot" onclick="startSetup('bot')">
        <div class="hm-card-icon">
          <img src="assets/avatars/bot.png" alt="">
        </div>
        <div class="hm-card-body">
          <span class="hm-card-title">נגד המחשב</span>
          <span class="hm-card-sub">התאמן מול הבוט ושפר את יכולתך</span>
        </div>
        <div class="hm-card-chev">❯</div>
      </button>

      <!-- 2P -->
      <button class="hm-card hm-card--2p" onclick="startSetup('vs')">
        <div class="hm-card-icon">
          <img src="assets/icons/1v1.png" alt="">
        </div>
        <div class="hm-card-body">
          <span class="hm-card-title">שני שחקנים</span>
          <span class="hm-card-sub">שחק עם חבר על אותו מכשיר</span>
        </div>
        <div class="hm-card-chev">❯</div>
      </button>

    </div><!-- /hm-cards -->

    <!-- ─ Leaderboard row — rank shown once known (signed-in players) ─ -->
    <button class="hm-strip hm-strip--lb" id="home-lb-row" style="display:none">
      <span class="hm-strip-ic hm-strip-ic--gold" aria-hidden="true"><svg class="hm-i" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4a3 3 0 0 0 4 4M16 6h4a3 3 0 0 1-4 4"/><path d="M12 13v4M8 20h8M10 17h4v3h-4z"/></svg></span>
      <span class="hm-strip-tx">טבלת דירוגים</span>
      <span class="hm-strip-pill" id="home-lb-rank"></span>
      <span class="hm-strip-chev" aria-hidden="true">❯</span>
    </button>

    <!-- ─ Bottom Navigation ───────────────────────── -->
    <!-- RTL flex-row: first item = RIGHT, last item = LEFT -->
    <nav id="home-bottom-nav" class="em-bottom-nav" aria-label="ניווט">

      <button class="em-nav-item em-nav-item--mygames" onclick="openMyGames()">
        <span class="em-nav-icon em-nav-ic"><svg class="gi"><use href="#gi-games"/></svg></span>
        <span class="em-nav-badge" id="mg-nav-badge" style="display:none" aria-live="polite"></span>
        <span class="em-nav-label">המשחקים שלי</span>
      </button>

      <button class="em-nav-item" onclick="openFriends()">
        <span class="em-nav-icon em-nav-ic"><svg class="gi"><use href="#gi-users"/></svg></span>
        <span class="em-nav-label">חברים</span>
      </button>

      <button class="em-nav-item" onclick="showAvatarGallery()">
        <span class="em-nav-icon em-nav-ic"><svg class="gi"><use href="#gi-trophy"/></svg></span>
        <span class="em-nav-label">הישגים</span>
      </button>

      <button class="em-nav-item" onclick="openStats()">
        <span class="em-nav-icon em-nav-ic"><svg class="gi"><use href="#gi-chart"/></svg></span>
        <span class="em-nav-label">סטטיסטיקות</span>
      </button>

    </nav>

    <!-- Credit -->
    <div class="credit">
      <a href="privacy-policy.html" target="_blank">מדיניות פרטיות</a> · v2.1 · build 20260907190058
      <br>
      <span dir="ltr">Music: "Inspire Action" by <a href="https://freemusicarchive.org/music/ura-megis/" target="_blank" rel="noopener">Yuri Megis</a> · <a href="https://freemusicarchive.org/music/ura-megis/single/inspire-action-1/" target="_blank" rel="noopener">Free Music Archive</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></span>
    </div>

  </div>
</div>
