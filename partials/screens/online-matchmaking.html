<!-- ONLINE: MATCHMAKING (glass bottom sheet — tools/screens-mockup "#ov-matchmaking") -->
<div id="ov-matchmaking" class="ov hidden">
  <div class="ovc mf-ovc g-sheet">
    <div class="g-sh">
      <span class="g-sock"><svg class="gi"><use href="#gi-dice"/></svg></span>
      <h3>חיפוש יריב אקראי</h3>
      <button class="g-chip ic" onclick="mmCancel()" aria-label="ביטול"><svg class="gi"><use href="#gi-x"/></svg></button>
    </div>

    <div id="mm-name-row" class="mf-name-row">
      <label class="g-flbl" for="mm-name">השם שלך</label>
      <div class="g-fld"><svg class="gi"><use href="#gi-user"/></svg><input id="mm-name" type="text" value="שחקן" maxlength="10"></div>
    </div>

    <div>
      <div class="g-lbl">סוג משחק</div>
      <div class="g-seg">
        <button id="mm-mode-live" class="active" onclick="mmSetMode('live')"><svg class="gi"><use href="#gi-bolt"/></svg>לייב</button>
        <button id="mm-mode-async" onclick="mmSetMode('async')"><svg class="gi"><use href="#gi-mail"/></svg>אסינכרוני</button>
      </div>
    </div>

    <div id="mm-speed-row">
      <div class="g-lbl">קצב משחק</div>
      <div class="g-seg">
        <button id="mm-spd-20">בזק · 20</button>
        <button id="mm-spd-40" class="active">רגיל · 40</button>
        <button id="mm-spd-60">איטי · 60</button>
      </div>
    </div>

    <div id="mm-rating-row" style="display:none">
      <div class="g-lbl">טווח דירוג</div>
      <div class="g-seg">
        <button id="mm-rr-any" class="active" onclick="mmSetRatingRange(null)">כולם</button>
        <button id="mm-rr-100" onclick="mmSetRatingRange(100)">±100</button>
        <button id="mm-rr-200" onclick="mmSetRatingRange(200)">±200</button>
        <button id="mm-rr-500" onclick="mmSetRatingRange(500)">±500</button>
      </div>
    </div>

    <label class="g-row mf-strict-row g-togrow">
      <span class="g-grow" style="font-weight:800">חיפוש מדויק בלבד</span>
      <input type="checkbox" id="mm-strict-chk" class="g-tog-input" checked>
    </label>

    <div id="mm-status" style="display:none" class="mf-search-status">
      <div class="mf-dots"><div class="sdot"></div><div class="sdot"></div><div class="sdot"></div></div>
      <div id="mm-status-text" class="mf-search-text">מחפש יריב...</div>
    </div>

    <button class="g-btn go" id="mm-search-btn"><svg class="gi"><use href="#gi-dice"/></svg> חפש יריב</button>
  </div>
</div>
