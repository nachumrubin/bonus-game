<!-- COIN TOSS / FIRST TURN (glass skin — tools/screens-mockup "#scoin") -->
<div id="scoin" class="screen hidden g-screen">
  <div class="g-page coin-wrap">
    <div class="g-scroll coin-g-body">
      <div class="g-c">
        <div class="coin-kick">מי מתחיל?</div>
        <div class="coin-title">הגרלת שחקן פותח</div>
        <div class="coin-sub" id="coin-sub">מטילים מטבע...</div>
      </div>

      <!-- Hero: rays + floating coin -->
      <div class="coin-hero-wrap">
        <div class="coin-g-rays" aria-hidden="true"></div>
        <div class="coin-float">
          <div class="coin-disc" id="coin-disc">🪙</div>
        </div>
      </div>

      <!-- The two players; the starter lights up after the flip (coinTossScreen.js) -->
      <div class="coin-sides">
        <div class="coin-side" id="coin-side-0">
          <span class="g-avr cyc" style="--s:60px"><svg class="gi"><use href="#gi-user"/></svg></span>
          <b id="coin-p1-name">שחקן 1</b>
          <span class="g-pill coin-tag" id="coin-tag-0"></span>
        </div>
        <div class="coin-side" id="coin-side-1">
          <span class="g-avr gdc" style="--s:60px"><svg class="gi"><use href="#gi-user"/></svg></span>
          <b id="coin-p2-name">שחקן 2</b>
          <span class="g-pill coin-tag" id="coin-tag-1"></span>
        </div>
      </div>

      <div class="coin-msg" id="coin-msg">בהצלחה!</div>
    </div>

    <div class="g-dock">
      <button id="coin-enter" class="g-btn go coin-enter" type="button" onclick="enterGameAfterCoinToss()" disabled>כניסה למשחק ←</button>
    </div>
  </div>
</div>
