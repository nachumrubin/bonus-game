<!-- LOG IN SCREEN (glass skin — tools/screens-mockup "#sauth-login") -->
<div id="sauth-login" class="screen hidden g-screen">
  <div class="g-page">
    <div class="g-hdr">
      <button class="g-chip ic" onclick="goHome()" aria-label="חזרה"><svg class="gi"><use href="#gi-back"/></svg></button>
      <span></span><span></span>
    </div>
    <div class="g-scroll auth-g" style="gap:12px">
      <div class="hlogo auth-logo" role="img" aria-label="בוסט">
        <img class="hl-img" src="assets/ui/boost-logo.webp" alt="" width="1100" height="450" decoding="async">
      </div>
      <div class="g-c" style="margin-bottom:6px">
        <div class="stitle" style="font-size:22px">ברוך שובך</div>
        <div class="g-dim">היכנס כדי לשמור דירוג, מטבעות והישגים</div>
      </div>
      <div class="sf">
        <label class="g-flbl" for="li-email">דוא"ל</label>
        <div class="g-fld" dir="ltr"><svg class="gi"><use href="#gi-mail"/></svg><input id="li-email" type="email" placeholder="your@email.com" autocomplete="email" dir="ltr"></div>
      </div>
      <div class="sf">
        <label class="g-flbl" for="li-pass">סיסמה</label>
        <div class="g-fld pw-wrap" dir="ltr"><svg class="gi"><use href="#gi-lock"/></svg><input id="li-pass" class="pw-input" type="password" placeholder="••••••••" autocomplete="current-password" dir="ltr"><button type="button" class="pw-toggle" data-pw-target="li-pass" aria-label="הצג סיסמה"><svg class="gi"><use href="#gi-eye"/></svg></button></div>
      </div>
      <div id="li-error" class="auth-err"></div>
      <button class="g-btn link" id="li-forgot-btn" style="align-self:flex-start">שכחתי סיסמה</button>
      <button class="g-btn go" id="li-submit-btn" onclick="loginUser()">כניסה</button>
      <div class="g-lbl plain" style="justify-content:center;margin:4px 0">— או —</div>
      <button type="button" class="g-btn google" id="li-google-btn"><svg class="g-google-mark" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>המשך עם Google</span></button>
      <div class="g-btns">
        <button class="g-btn" onclick="showSc('sauth-signup')">חשבון חדש</button>
        <button class="g-btn" onclick="continueAsGuest()">המשך כאורח</button>
      </div>
    </div>
  </div>
</div>
