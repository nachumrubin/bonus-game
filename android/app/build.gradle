apply plugin: 'com.android.application'

// Read signing credentials from keystore.properties (not committed to git)
def keystorePropertiesFile = rootProject.file('../keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36
    namespace 'app.boost8ef11.twa'

    defaultConfig {
        applicationId 'app.boost8ef11.twa'
        minSdk 24
        targetSdk 36
        versionCode 20
        versionName '1.5.3'
        // AdMob ids from gradle.properties (RewardedAdActivity).
        manifestPlaceholders = [admobAppId: project.property('admobAppId')]
        resValue 'string', 'admobRewardedUnitId', project.property('admobRewardedUnitId')
    }

    // Passwords come from keystore.properties or, failing that, the environment
    // (scripts/build-android-release.ps1 asks for them and sets BOOST_*).
    signingConfigs {
        release {
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : rootProject.file('android.keystore')
            storePassword keystoreProperties['storePassword'] ?: System.getenv('BOOST_STORE_PASSWORD') ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: System.getenv('BOOST_KEY_ALIAS') ?: 'android'
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv('BOOST_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            // Google's test ids: never click real ads from a dev build.
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            resValue 'string', 'admobRewardedUnitId', 'ca-app-pub-3940256099942544/5224354917'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    // Play Billing for the web app's Digital Goods API (coin packs). Pulls in the Play
    // Billing Library, which adds the com.android.vending.BILLING permission.
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'
    // Rewarded video ads (RewardedAdActivity); coins are credited by the worker's AdMob SSV.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
